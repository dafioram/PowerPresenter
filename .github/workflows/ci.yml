name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Browser tests (headless)
        run: npx playwright test
        env:
          PW_BROWSERS: chromium,firefox
      - name: Browser tests (headed, under a virtual display)
        run: xvfb-run -a npx playwright test --headed --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
